# Start everything:            docker compose up --build        (open http://localhost:8080)
# Run all tests with MySQL:    docker compose --profile test run --rm tests
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: library
      MYSQL_USER: library
      MYSQL_PASSWORD: library
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      STORAGE: mysql
      DB_URL: jdbc:mysql://db:3306/library?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USER: library
      DB_PASSWORD: library
      SEED: "true"          # creates the demo accounts and books when the database is empty
      DEV_MODE: "true"      # shows sent e-mails at /api/dev/outbox (the demo has no real mail server)
      TZ: Asia/Ho_Chi_Minh

  tests:
    profiles: ["test"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - m2cache:/root/.m2
    environment:
      TEST_DB_URL: jdbc:mysql://db:3306/library_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      TEST_DB_USER: library
      TEST_DB_PASSWORD: library
      TZ: Asia/Ho_Chi_Minh
    command: mvn -B test

volumes:
  dbdata:
  m2cache:
